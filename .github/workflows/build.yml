# Installateurs de Plume, construits ici car ce dépôt est public (minutes macOS et Windows gratuites).
# Le code reste dans le dépôt privé ExoKayn/plume : il est récupéré avec le secret PLUME_SOURCE_TOKEN (lecture seule).
# Déclenché par l'étiquette v* de ExoKayn/plume (repository_dispatch « build »), ou à la main avec l'étiquette voulue.
name: Installateurs

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      tag:
        description: Étiquette de ExoKayn/plume à construire (ex. v0.2.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ExoKayn/plume
          ref: ${{ env.TAG }}
          token: ${{ secrets.PLUME_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # dist regroupe l'éditeur puis construit les cibles de la plateforme (package.json, clé build)
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: plume-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --title "Plume $TAG" \
            --notes "Installateurs : Windows (.exe), macOS puce Apple (mac-arm64.dmg) et Intel (mac-x64.dmg), Linux (.AppImage)."
